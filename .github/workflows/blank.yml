name: เครื่องควยสั่น

on:
  workflow_dispatch:
    inputs:
      playit_secret_key:
        description: 'Playit.gg Agent Secret Key'
        required: false
        default: 'b8378c5e60d03a21577d64f09e8faeeee0d23c5c0539a5a727f51ed2e845554b'

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 360

    steps:
      - name: รัน RDP, Cloudflare Tunnel และซิงก์ MEGA กับ C:\RDPData
        shell: pwsh
        env:
          INPUT_PLAYIT_KEY: ${{ inputs.playit_secret_key }}
          SECRET_PLAYIT_KEY: ${{ secrets.PLAYIT_SECRET_KEY }}
          DEFAULT_PLAYIT_KEY: "b8378c5e60d03a21577d64f09e8faeeee0d23c5c0539a5a727f51ed2e845554b"
        run: |
          $logWebhook = "https://discord.com/api/webhooks/1563607634639061022/KS00fAaB5ufv4xlAulXPwPOljKxPr8HGkjjWfp5vo5cRMlhEW14m8Sp36VzuY8RC-ubR"
          $infoWebhook = "https://discord.com/api/webhooks/1564191578665517076/P8HQRpjZcbmT9waXe2Vz8Mvbw3KJQfopqq1UcYjt97y5Ovnneipk7zvvS7Ts_tzFIHdg"

          $megaEmail = "jirawatkaewninta@gmail.com"
          $megaPass = "Jira12344031!"

          $workDir = "C:\RDPData"
          $remoteMegaDir = "/MEGA"
          $backupZip = "C:\temp\BackupData.zip"

          foreach ($dir in @($workDir, "C:\temp")) {
              if (-not (Test-Path $dir)) {
                  New-Item -ItemType Directory -Path $dir -Force | Out-Null
              }
          }

          function Send-Log {
              param([string]$message)
              if ($logWebhook -and $message -notmatch "t\.me" -and $message -notmatch "A_TOOLS") {
                  $body = @{ content = $message } | ConvertTo-Json
                  try {
                      Invoke-RestMethod -Uri $logWebhook -Method Post -Body $body -ContentType 'application/json'
                  } catch {}
              }
          }

          function Invoke-MegaBackupSync {
              if (Test-Path $workDir) {
                  $items = Get-ChildItem -Path $workDir -Force -ErrorAction SilentlyContinue
                  if ($items) {
                      Compress-Archive -Path "$workDir\*" -DestinationPath $backupZip -Force -ErrorAction SilentlyContinue
                  }
              }
              if ($megaReady) {
                  & mega-sync $workDir $remoteMegaDir 2>$null
              }
          }

          try {
              Send-Log "Starting Windows RDP setup with Cloudflare Quick Tunnel and MEGA Sync on C:\RDPData..."

              # 1. ติดตั้ง MEGAcmd และผูก C:\RDPData <-> /MEGA โดยตรง
              Send-Log "Installing and logging into MEGAcmd..."
              $megaInstaller = "$env:TEMP\MEGAcmdSetup.exe"
              Invoke-WebRequest -Uri "https://mega.nz/MEGAcmdSetup.exe" -OutFile $megaInstaller
              Start-Process -FilePath $megaInstaller -ArgumentList "/S" -Wait -NoNewWindow

              $megaDir = "$env:LOCALAPPDATA\MEGAcmd"
              if (-not (Test-Path $megaDir)) {
                  $altDir = "C:\Program Files\MEGAcmd"
                  if (Test-Path $altDir) { $megaDir = $altDir }
              }
              if (Test-Path $megaDir) {
                  $currentPath = [Environment]::GetEnvironmentVariable("Path", "Machine")
                  if ($currentPath -notlike "*$megaDir*") {
                      [Environment]::SetEnvironmentVariable("Path", "$currentPath;$megaDir", "Machine")
                  }
                  $env:Path += ";$megaDir"
              }

              Start-Process -FilePath "MEGAcmdServer.exe" -WindowStyle Hidden -ErrorAction SilentlyContinue
              $megaReady = $false
              for ($i = 0; $i -lt 15; $i++) {
                  Start-Sleep -Seconds 2
                  & mega-login $megaEmail $megaPass 2>$null
                  & mega-whoami 2>$null
                  if ($LASTEXITCODE -eq 0) {
                      $megaReady = $true
                      break
                  }
              }

              if ($megaReady) {
                  & mega-mkdir $remoteMegaDir 2>$null
                  & mega-get -r $remoteMegaDir $workDir 2>$null
                  & mega-sync $workDir $remoteMegaDir
                  Send-Log "MEGAcmd synced directly: $workDir <-> $remoteMegaDir."
              } else {
                  Send-Log "MEGAcmd login/server not ready; continuing setup."
              }

              # 2. ติดตั้ง Cloudflare Tunnel และเตรียมไฟล์ playit.exe + playit.toml ไว้ให้เปิดเองในเครื่อง
              Send-Log "Installing cloudflared and preparing playit binary..."
              $cloudflaredPath = "C:\temp\cloudflared.exe"
              Invoke-WebRequest -Uri "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe" -OutFile $cloudflaredPath

              $playitPath = "C:\Windows\System32\playit.exe"
              Invoke-WebRequest -Uri "https://github.com/playit-cloud/playit-agent/releases/latest/download/playit-windows-x86_64.exe" -OutFile $playitPath

              $playitKey = "$env:INPUT_PLAYIT_KEY".Trim()
              if (-not $playitKey) { $playitKey = "$env:SECRET_PLAYIT_KEY".Trim() }
              if (-not $playitKey) { $playitKey = "$env:DEFAULT_PLAYIT_KEY".Trim() }

              $playitDir = "$env:LOCALAPPDATA\playit_gg"
              New-Item -ItemType Directory -Path $playitDir -Force | Out-Null
              Set-Content -Path "$playitDir\playit.toml" -Value "secret_key = `"$playitKey`"" -Encoding Ascii -Force

              # 3. ตั้งค่า RDP และสร้าง User Fazah พร้อมรหัสผ่าน Fazah@123
              Send-Log "Enabling Remote Desktop and creating user Fazah..."
              Set-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" -Name "fDenyTSConnections" -Value 0 -Force
              Set-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" -Name "UserAuthentication" -Value 1 -Force
              Set-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" -Name "PortNumber" -Value 3389 -Force

              secedit /export /cfg C:\secpol.cfg | Out-Null
              (Get-Content C:\secpol.cfg) -replace 'PasswordComplexity = 1', 'PasswordComplexity = 0' -replace 'MinimumPasswordLength = \d+', 'MinimumPasswordLength = 0' | Set-Content C:\secpol.cfg
              secedit /configure /db C:\windows\security\local.sdb /cfg C:\secpol.cfg /areas SECURITYPOLICY | Out-Null
              Remove-Item -Force C:\secpol.cfg -ErrorAction SilentlyContinue

              net user Fazah "Fazah@123" /add /expires:never /active:yes
              net localgroup Administrators Fazah /add
              net localgroup "Remote Desktop Users" Fazah /add

              Restart-Service -Name "TermService" -Force
              netsh advfirewall firewall add rule name="Allow-RDP" dir=in action=allow protocol=TCP localport=3389 | Out-Null
              Enable-NetFirewallRule -DisplayGroup "Remote Desktop" -ErrorAction SilentlyContinue

              # 4. กู้คืน BackupData.zip (ถ้ามี) ลง C:\RDPData แล้วซิงก์ให้ตรงกัน
              Send-Log "Restoring backup data if available..."
              if (Test-Path $backupZip) {
                  Expand-Archive -Path $backupZip -DestinationPath $workDir -Force -ErrorAction SilentlyContinue
                  Send-Log "Data restored to $workDir from BackupData.zip."
              } else {
                  Send-Log "No BackupData.zip found in C:\temp, using synced $remoteMegaDir contents in $workDir."
              }
              if ($megaReady) {
                  & mega-sync $workDir $remoteMegaDir 2>$null
              }

              Write-Host "=========================================="
              Write-Host "Username: Fazah"
              Write-Host "Password: Fazah@123"
              Write-Host "Work & MEGA Sync: $workDir <-> $remoteMegaDir"
              Write-Host "=========================================="

              $cfOutLog = "C:\temp\cf_out.log"
              $cfErrLog = "C:\temp\cf_err.log"

              function Start-CloudflareTunnel {
                  if (Test-Path $cfOutLog) { Remove-Item $cfOutLog -Force -ErrorAction SilentlyContinue }
                  if (Test-Path $cfErrLog) { Remove-Item $cfErrLog -Force -ErrorAction SilentlyContinue }

                  $cfProcess = Start-Process -FilePath $cloudflaredPath `
                      -ArgumentList "tunnel --no-autoupdate --url tcp://localhost:3389" `
                      -RedirectStandardOutput $cfOutLog `
                      -RedirectStandardError $cfErrLog `
                      -PassThru `
                      -NoNewWindow

                  Write-Host "กำลังเชื่อมต่อ Cloudflare Quick Tunnel..."
                  $quickUrl = $null
                  $sw = [System.Diagnostics.Stopwatch]::StartNew()

                  while ($sw.ElapsedMilliseconds -lt 25000 -and -not $cfProcess.HasExited) {
                      $combinedText = ""
                      if (Test-Path $cfOutLog) { $combinedText += (Get-Content $cfOutLog -Raw -ErrorAction SilentlyContinue) }
                      if (Test-Path $cfErrLog) { $combinedText += "`n" + (Get-Content $cfErrLog -Raw -ErrorAction SilentlyContinue) }

                      $match = [regex]::Match($combinedText, "https://[a-zA-Z0-9-]+\.trycloudflare\.com")
                      if ($match.Success) {
                          $quickUrl = $match.Value
                          break
                      }
                      Start-Sleep -Milliseconds 300
                  }

                  if ($quickUrl) {
                      Write-Host "Cloudflare Quick URL: $quickUrl"
                  } else {
                      Write-Host "Cloudflare Quick Tunnel started. Check logs for trycloudflare.com URL."
                  }

                  if ($infoWebhook) {
                      if ($quickUrl) {
                          $msg = "Windows RDP is ready!`nQuick Tunnel: $quickUrl`nUser: Fazah`nPass: Fazah@123"
                      } else {
                          $msg = "Windows RDP is ready!`nCloudflare Quick Tunnel active (Check GitHub Logs for URL)`nUser: Fazah`nPass: Fazah@123"
                      }
                      $bodyInfo = @{ content = $msg } | ConvertTo-Json
                      try {
                          Invoke-RestMethod -Uri $infoWebhook -Method Post -Body $bodyInfo -ContentType 'application/json'
                      } catch {}
                  }

                  return $cfProcess
              }

              $cfProcess = Start-CloudflareTunnel
              Send-Log "Setup completed successfully!"

              # 5. วนลูปค้างระบบ ซิงก์ทุก 5 นาที และต่อ Cloudflare Tunnel ใหม่เมื่อหลุด (ไม่แตะ playit)
              $loopCount = 0
              while ($true) {
                  $loopCount++

                  try {
                      if (-not $cfProcess -or $cfProcess.HasExited) {
                          Write-Host "Cloudflare Tunnel disconnected. Backing up and reconnecting..."
                          Invoke-MegaBackupSync
                          Send-Log "Auto-backed up and synced C:\RDPData <-> /MEGA."
                          $cfProcess = Start-CloudflareTunnel
                      } elseif ($loopCount % 10 -eq 0) {
                          Invoke-MegaBackupSync
                          Send-Log "Periodic sync completed: C:\RDPData <-> /MEGA"
                      }
                  } catch {
                      Write-Host "Loop sync/tunnel warning: $($_.Exception.Message)"
                  }

                  Start-Sleep -Seconds 30
              }
          }
          catch {
              $errMsg = $_.Exception.Message
              Send-Log "ERROR occurred: $errMsg"
              throw $_
          }
