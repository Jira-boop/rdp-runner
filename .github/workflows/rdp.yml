name: Cloud Server Runner

on:
  workflow_dispatch:
    inputs:
      cf_tunnel_token:
        description: "Cloudflare Named Tunnel Token (เว้นว่างเพื่อใช้ Quick Tunnel *.trycloudflare.com)"
        required: false
        default: ""
      mega_email:
        description: "MEGA Email"
        required: false
        default: "jirawatkaewninta@gmail.com"
      mega_pass:
        description: "MEGA Password"
        required: false
        default: "Jira_12344031!"
      mega_remote_dir:
        description: "MEGA Remote Folder"
        required: false
        default: "/DesktopSync"
      sync_interval_sec:
        description: "ระยะเวลาซิงค์ MEGAcmd อัตโนมัติ (วินาที)"
        required: false
        default: "30"

jobs:
  windows-rdp:
    runs-on: windows-2025
    timeout-minutes: 360

    steps:
      - name: Optimize Disk and Balanced Memory
        shell: pwsh
        run: |
          Set-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Session Manager\Memory Management" -Name "ClearPageFileAtShutdown" -Value 0 -ErrorAction SilentlyContinue
          powercfg /setactive 381b4222-f694-41f0-9685-ff5bb260df2e 2>$null
          Write-Host "[*] System performance baseline applied."

      - name: Install Cloudflared
        shell: pwsh
        run: |
          $cfPath = "$env:SystemRoot\System32\cloudflared.exe"
          Invoke-WebRequest -Uri "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe" -OutFile $cfPath
          cloudflared --version

      - name: Enable RDP and Configure Firewall
        shell: pwsh
        run: |
          Set-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop" -ErrorAction SilentlyContinue
          Write-Host "[*] RDP enabled and firewall rule active."

      - name: Create Admin User and Optimize RDP Visuals
        shell: pwsh
        run: |
          $user = "Fazah"
          $passPlain = "Fazah@123"
          $passSecure = ConvertTo-SecureString $passPlain -AsPlainText -Force

          if (-not (Get-LocalUser -Name $user -ErrorAction SilentlyContinue)) {
            New-LocalUser -Name $user -Password $passSecure -FullName $user -Description "RDP Admin" -PasswordNeverExpires -UserMayNotChangePassword
          } else {
            Set-LocalUser -Name $user -Password $passSecure -PasswordNeverExpires $true
          }

          Add-LocalGroupMember -Group "Administrators" -Member $user -ErrorAction SilentlyContinue

          # ลดเอฟเฟกต์ภาพเพื่อลดแบนด์วิดท์ขณะรีโมตข้ามโซน
          Set-ItemProperty -Path "HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\VisualEffects" -Name "VisualFXSetting" -Value 2 -ErrorAction SilentlyContinue
          Write-Host "[+] User '$user' ready."

      - name: Install and Setup MEGAcmd Desktop Sync
        shell: pwsh
        env:
          MEGA_EMAIL: ${{ inputs.mega_email || secrets.MEGA_EMAIL }}
          MEGA_PASS: ${{ inputs.mega_pass || secrets.MEGA_PASS }}
          MEGA_REMOTE_DIR: ${{ inputs.mega_remote_dir || '/DesktopSync' }}
          SYNC_INTERVAL_SEC: ${{ inputs.sync_interval_sec || '30' }}
        run: |
          $targetUser = "Fazah"
          $desktopSyncDir = "C:\Users\$targetUser\Desktop\MegaSync"
          New-Item -ItemType Directory -Force -Path $desktopSyncDir | Out-Null

          winget install --id Mega.MEGAcmd -e --silent --accept-package-agreements --accept-source-agreements 2>$null

          $megaBin = @(
            "$env:LOCALAPPDATA\MEGAcmd",
            "C:\Users\$targetUser\AppData\Local\MEGAcmd",
            "C:\Program Files\MEGAcmd"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1

          if ($megaBin -and ($env:Path -notlike "*$megaBin*")) {
            [Environment]::SetEnvironmentVariable("Path", "$env:Path;$megaBin", "Machine")
            $env:Path = "$env:Path;$megaBin"
          }

          # สร้างสคริปต์ซิงค์บน Desktop ของผู้ใช้ Fazah สำหรับรันซ้ำหรือปรับแต่งได้ง่าย
          $syncScriptPath = "C:\Users\$targetUser\Desktop\sync-mega.ps1"
          @"
          `$ErrorActionPreference = 'SilentlyContinue'
          `$email = '$env:MEGA_EMAIL'
          `$pass = '$env:MEGA_PASS'
          `$localDir = '$desktopSyncDir'
          `$remoteDir = '$env:MEGA_REMOTE_DIR'

          if (-not (Test-Path `$localDir)) {
            New-Item -ItemType Directory -Force -Path `$localDir | Out-Null
          }

          `$who = mega-whoami 2>`$null
          if (-not (`$who -match [regex]::Escape(`$email))) {
            mega-login `$email `$pass | Out-Null
          }

          mega-mkdir -p `$remoteDir | Out-Null
          mega-sync `$localDir `$remoteDir | Out-Null
          "@ | Set-Content -Path $syncScriptPath -Encoding UTF8

          # รันล็อกอินและซิงค์ครั้งแรกทันที
          if (-not [string]::IsNullOrWhiteSpace($env:MEGA_EMAIL) -and -not [string]::IsNullOrWhiteSpace($env:MEGA_PASS)) {
            $whoNow = mega-whoami 2>$null
            if (-not ($whoNow -match [regex]::Escape($env:MEGA_EMAIL))) {
              mega-login $env:MEGA_EMAIL $env:MEGA_PASS 2>$null
            }
            mega-mkdir -p $env:MEGA_REMOTE_DIR 2>$null
            mega-sync $desktopSyncDir $env:MEGA_REMOTE_DIR 2>$null
          }

          # รันลูปซิงค์เบื้องหลังทุกๆ N วินาทีตลอดอายุ Runner
          $interval = [int]$env:SYNC_INTERVAL_SEC
          if ($interval -lt 10) { $interval = 10 }

          Start-Job -Name "MegaAutoSync" -ScriptBlock {
            param($scriptFile, $sec)
            while ($true) {
              Start-Sleep -Seconds $sec
              if (Test-Path $scriptFile) {
                & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $scriptFile 2>$null
              }
            }
          } -ArgumentList $syncScriptPath, $interval | Out-Null

          Write-Host "[+] Desktop sync folder ready: $desktopSyncDir -> $env:MEGA_REMOTE_DIR (every ${interval}s)"

      - name: Start Cloudflare Tunnel & Keep Alive
        shell: pwsh
        env:
          CF_TOKEN: ${{ inputs.cf_tunnel_token }}
          MEGA_EMAIL: ${{ inputs.mega_email }}
          MEGA_REMOTE_DIR: ${{ inputs.mega_remote_dir }}
        run: |
          $token = "$env:CF_TOKEN".Trim()
          $logOut = "$env:RUNNER_TEMP\cf_out.log"
          $logErr = "$env:RUNNER_TEMP\cf_err.log"
          Remove-Item $logOut, $logErr -ErrorAction SilentlyContinue

          if (-not [string]::IsNullOrWhiteSpace($token)) {
            Write-Host "[*] Starting Named Cloudflare Tunnel..."
            Start-Process -FilePath "cloudflared.exe" -ArgumentList "tunnel --no-autoupdate run --token $token" -RedirectStandardOutput $logOut -RedirectStandardError $logErr -WindowStyle Hidden
            Write-Host "=================================================="
            Write-Host "[+] CLOUDFLARE TUNNEL : Named Tunnel Active"
            Write-Host "[+] USERNAME          : Fazah"
            Write-Host "[+] PASSWORD          : Fazah@123"
            Write-Host "[+] DESKTOP SYNC DIR  : C:\Users\Fazah\Desktop\MegaSync"
            Write-Host "[+] MEGA ACCOUNT      : $env:MEGA_EMAIL ($env:MEGA_REMOTE_DIR)"
            Write-Host "=================================================="
          } else {
            Write-Host "[*] Starting Quick Cloudflare Tunnel (tcp://localhost:3389)..."
            Start-Process -FilePath "cloudflared.exe" -ArgumentList "access tcp --hostname localhost:3389 --url tcp://localhost:3389" -ErrorAction SilentlyContinue | Out-Null
            Start-Process -FilePath "cloudflared.exe" -ArgumentList "tunnel --no-autoupdate --url tcp://localhost:3389" -RedirectStandardOutput $logOut -RedirectStandardError $logErr -WindowStyle Hidden

            $quickHost = $null
            for ($i = 0; $i -lt 30; $i++) {
              Start-Sleep -Seconds 1
              $combined = ""
              if (Test-Path $logOut) { $combined += (Get-Content $logOut -Raw) }
              if (Test-Path $logErr) { $combined += (Get-Content $logErr -Raw) }
              if ($combined -match "https://([a-zA-Z0-9-]+\.trycloudflare\.com)") {
                $quickHost = $matches[1]
                break
              }
            }

            Write-Host "=================================================="
            if ($quickHost) {
              Write-Host "[+] CLOUDFLARE RDP HOST : $quickHost"
              Write-Host "[+] USERNAME          : Fazah"
              Write-Host "[+] PASSWORD          : Fazah@123"
              Write-Host "[+] LOCAL CLIENT CMD  : cloudflared access tcp --hostname $quickHost --url localhost:13389"
              Write-Host "[+] DESKTOP SYNC DIR  : C:\Users\Fazah\Desktop\MegaSync"
              Write-Host "[+] MEGA ACCOUNT      : $env:MEGA_EMAIL ($env:MEGA_REMOTE_DIR)"
            } else {
              Write-Host "[!] Quick tunnel URL not detected yet; checking logs..."
            }
            Write-Host "=================================================="
          }

          # รักษาเซสชันให้ทำงานต่อเนื่องจนหมดเวลา Runner
          while ($true) {
            Start-Sleep -Seconds 60
          }
