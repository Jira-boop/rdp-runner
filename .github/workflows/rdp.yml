name: Cloud Server Runner (Cloudflare Tunnel)

on:
  workflow_dispatch:
    inputs:
      os_type:
        description: 'Server OS (windows-2022, windows-2025, ubuntu-24.04, ubuntu-gui)'
        required: false
        default: 'windows-2022'
      ram_profile:
        description: 'Memory Profile (balanced-16gb, high-swap-24gb)'
        required: false
        default: 'balanced-16gb'
      cf_tunnel_token:
        description: 'Cloudflare Tunnel Token (Leave empty for Quick Tunnel *.trycloudflare.com)'
        required: false
        default: ''

jobs:
  windows-rdp:
    if: "inputs.os_type == '' || startsWith(inputs.os_type, 'windows')"
    runs-on: ${{ inputs.os_type == 'windows-2025' && 'windows-2025' || 'windows-2022' }}
    timeout-minutes: 360
    steps:
      - name: Optimize Disk and Balanced Memory
        shell: pwsh
        run: |
          $profile = "${{ inputs.ram_profile }}"
          Write-Output "[*] Applying Memory Profile: $profile (Physical RAM: 16GB)"

          if ($profile -eq "high-swap-24gb") {
            try {
              Set-CimInstance -Query "Select * from Win32_ComputerSystem" -Property @{AutomaticManagedPagefile = $false} -ErrorAction SilentlyContinue
              Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Session Manager\Memory Management' -Name 'PagingFiles' -Value @("C:\pagefile.sys 8192 16384") -ErrorAction SilentlyContinue
              Write-Output "[+] Balanced Pagefile configured (8GB - 16GB)."
            } catch {}
          }

          Start-Job { Remove-Item -Recurse -Force "C:\hostedtoolcache" -ErrorAction SilentlyContinue } | Out-Null
          $freeGB = [Math]::Round((Get-PSDrive C).Free / 1GB, 1)
          Write-Output "[+] Available SSD Space: $freeGB GB"

      - name: Install Cloudflared
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe" -OutFile "C:\Windows\System32\cloudflared.exe"
          cloudflared --version

      - name: Enable RDP and Configure Firewall
        shell: pwsh
        run: |
          Set-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" -Name "SecurityLayer" -Value 1 -Force
          Set-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" -Name "PortNumber" -Value 3389 -Force

          Set-Service -Name "TermService" -StartupType Automatic
          Restart-Service -Name "TermService" -Force

          netsh advfirewall firewall add rule name="Allow-RDP" dir=in action=allow protocol=TCP localport=3389 | Out-Null
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop" -ErrorAction SilentlyContinue

      - name: Create Admin User
        shell: pwsh
        run: |
          secedit /export /cfg C:\secpol.cfg | Out-Null
          (Get-Content C:\secpol.cfg).replace("PasswordComplexity = 1", "PasswordComplexity = 0").replace("MinimumPasswordLength = 8", "MinimumPasswordLength = 0") | Set-Content C:\secpol.cfg
          secedit /configure /db C:\windows\security\local.sdb /cfg C:\secpol.cfg /areas SECURITYPOLICY | Out-Null
          Remove-Item -Force C:\secpol.cfg -ErrorAction SilentlyContinue

          cmd.exe /c "net user Fazah Fazah@123 /add /expires:never /active:yes"
          cmd.exe /c "net localgroup Administrators Fazah /add"
          cmd.exe /c "net localgroup `"Remote Desktop Users`" Fazah /add"

      - name: Start Cloudflare Tunnel & Keep Alive
        shell: pwsh
        env:
          CF_TOKEN: ${{ inputs.cf_tunnel_token }}
          SECRET_CF_TOKEN: ${{ secrets.CF_TUNNEL_TOKEN }}
        run: |
          $token = "$env:CF_TOKEN".Trim()
          if (-not $token) { $token = "$env:SECRET_CF_TOKEN".Trim() }

          if ($token) {
            Write-Output "[*] Starting Named Cloudflare Tunnel..."
            $proc = Start-Process -FilePath "cloudflared.exe" -ArgumentList "tunnel --no-autoupdate run --token $token" -PassThru -NoNewWindow
            Write-Output "[+] Named Tunnel is LIVE! Connect via your configured Cloudflare hostname."
          } else {
            Write-Output "[*] Starting Quick Cloudflare Tunnel (tcp://localhost:3389)..."
            $logFile = "C:\cf_tunnel.log"
            $proc = Start-Process -FilePath "cloudflared.exe" -ArgumentList "tunnel --no-autoupdate --url tcp://localhost:3389" -RedirectStandardError $logFile -PassThru -NoNewWindow

            $cfUrl = $null
            for ($i = 0; $i -lt 30; $i++) {
              Start-Sleep -Seconds 2
              if (Test-Path $logFile) {
                $content = Get-Content $logFile -Raw
                if ($content -match "https://[a-zA-Z0-9-]+\.trycloudflare\.com") {
                  $cfUrl = $matches[0] -replace "^https://", ""
                  break
                }
              }
            }

            if ($cfUrl) {
              Write-Output "=========================================================="
              Write-Output "[+] CLOUDFLARE RDP HOST : $cfUrl"
              Write-Output "[+] USERNAME            : Fazah"
              Write-Output "[+] PASSWORD            : Fazah@123"
              Write-Output "[+] LOCAL CLIENT CMD    : cloudflared access tcp --hostname $cfUrl --url localhost:3389"
              Write-Output "=========================================================="
            } else {
              Write-Output "[!] Failed to retrieve trycloudflare.com URL."
              Get-Content $logFile -ErrorAction SilentlyContinue
              exit 1
            }
          }

          while (-not $proc.HasExited) {
            Start-Sleep -Seconds 60
          }

  linux-vps:
    if: "inputs.os_type != '' && !startsWith(inputs.os_type, 'windows')"
    runs-on: ${{ inputs.os_type == 'ubuntu-22.04' && 'ubuntu-22.04' || 'ubuntu-24.04' }}
    timeout-minutes: 360
    steps:
      - name: Optimize Disk and Balanced Swap
        run: |
          profile="${{ inputs.ram_profile }}"
          echo "[*] Applying Memory Profile: $profile (Physical RAM: 16GB)"
          sudo rm -rf /opt/hostedtoolcache &

          swapGB=4
          if [ "$profile" = "high-swap-24gb" ]; then swapGB=8; fi
          echo "[*] Configuring ${swapGB}GB swap..."
          sudo swapoff -a || true
          sudo rm -f /swapfile || true
          sudo fallocate -l ${swapGB}G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Install Cloudflared
        run: |
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o cloudflared
          sudo install -m 755 cloudflared /usr/local/bin/cloudflared
          rm -f cloudflared
          cloudflared --version

      - name: Setup Ubuntu GUI (XRDP)
        if: "inputs.os_type == 'ubuntu-gui'"
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            xfce4 xfce4-terminal xrdp xorgxrdp dbus-x11 x11-xserver-utils

          id -u runner >/dev/null 2>&1 || sudo useradd -m -s /bin/bash runner
          echo "runner:Fazah@123" | sudo chpasswd
          sudo usermod -aG sudo runner
          sudo adduser xrdp ssl-cert || true

          echo "startxfce4" > /home/runner/.xsession
          sudo chown runner:runner /home/runner/.xsession
          sudo systemctl restart xrdp
          echo "TARGET_PORT=3389" >> $GITHUB_ENV

      - name: Setup Ubuntu SSH
        if: "inputs.os_type != 'ubuntu-gui'"
        run: |
          id -u runner >/dev/null 2>&1 || sudo useradd -m -s /bin/bash runner
          echo "runner:Fazah@123" | sudo chpasswd
          sudo usermod -aG sudo runner
          sudo sed -i 's/^#\?PasswordAuthentication.*/PasswordAuthentication yes/' /etc/ssh/sshd_config
          sudo systemctl restart ssh || sudo service ssh restart
          echo "TARGET_PORT=22" >> $GITHUB_ENV

      - name: Start Cloudflare Tunnel & Keep Alive
        env:
          CF_TOKEN: ${{ inputs.cf_tunnel_token }}
          SECRET_CF_TOKEN: ${{ secrets.CF_TUNNEL_TOKEN }}
        run: |
          port="${{ env.TARGET_PORT }}"
          if [ -z "$port" ]; then port=22; fi
          token=$(echo "$CF_TOKEN" | xargs)
          if [ -z "$token" ]; then token=$(echo "$SECRET_CF_TOKEN" | xargs); fi

          if [ -n "$token" ]; then
            echo "[*] Starting Named Cloudflare Tunnel..."
            cloudflared tunnel --no-autoupdate run --token "$token"
          else
            echo "[*] Starting Quick Cloudflare Tunnel (tcp://localhost:$port)..."
            cloudflared tunnel --no-autoupdate --url "tcp://localhost:$port" > /tmp/cf_tunnel.log 2>&1 &
            CF_PID=$!

            cf_url=""
            for i in $(seq 1 30); do
              sleep 2
              cf_url=$(grep -oE 'https://[a-zA-Z0-9-]+\.trycloudflare\.com' /tmp/cf_tunnel.log | head -n1 | sed 's|https://||')
              if [ -n "$cf_url" ]; then
                break
              fi
            done

            if [ -n "$cf_url" ]; then
              echo "=========================================================="
              echo "[+] CLOUDFLARE HOST : $cf_url (Port $port)"
              echo "[+] USERNAME        : runner"
              echo "[+] PASSWORD        : Fazah@123"
              echo "[+] CLIENT COMMAND  : cloudflared access tcp --hostname $cf_url --url localhost:$port"
              echo "=========================================================="
            else
              echo "[!] Failed to retrieve trycloudflare.com URL."
              cat /tmp/cf_tunnel.log
              exit 1
            fi

            wait $CF_PID
          fi
