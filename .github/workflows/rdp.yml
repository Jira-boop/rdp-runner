name: Cloud Server Runner (Playit Static Address)

on:
  workflow_dispatch:
    inputs:
      os_type:
        description: 'Server OS (windows-2022, windows-2025)'
        required: false
        default: 'windows-2022'
      ram_profile:
        description: 'Memory Profile (balanced-16gb, high-swap-24gb)'
        required: false
        default: 'balanced-16gb'
      playit_secret_key:
        description: 'Playit.gg Agent Secret Key'
        required: false
        default: 'b8378c5e60d03a21577d64f09e8faeeee0d23c5c0539a5a727f51ed2e845554b'

jobs:
  windows-rdp:
    if: "inputs.os_type == '' || startsWith(inputs.os_type, 'windows')"
    runs-on: ${{ inputs.os_type == 'windows-2025' && 'windows-2025' || 'windows-2022' }}
    timeout-minutes: 360
    steps:
      - name: Optimize Disk and Balanced Memory
        shell: pwsh
        run: |
          $profile = "${{ inputs.ram_profile }}"
          Write-Output "[*] Applying Memory Profile: $profile (Physical RAM: 16GB)"

          if ($profile -eq "high-swap-24gb") {
            try {
              Set-CimInstance -Query "Select * from Win32_ComputerSystem" -Property @{AutomaticManagedPagefile = $false} -ErrorAction SilentlyContinue
              Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Session Manager\Memory Management' -Name 'PagingFiles' -Value @("C:\pagefile.sys 8192 16384") -ErrorAction SilentlyContinue
              Write-Output "[+] Balanced Pagefile configured (8GB - 16GB)."
            } catch {}
          }

          Start-Job { Remove-Item -Recurse -Force "C:\hostedtoolcache" -ErrorAction SilentlyContinue } | Out-Null
          $freeGB = [Math]::Round((Get-PSDrive C).Free / 1GB, 1)
          Write-Output "[+] Available SSD Space: $freeGB GB"

      - name: Install Playit.gg Agent
        shell: pwsh
        run: |
          Write-Output "[*] Downloading Playit.gg Windows CLI..."
          Invoke-WebRequest -Uri "https://github.com/playit-cloud/playit-agent/releases/latest/download/playit-windows-x86_64.exe" -OutFile "C:\Windows\System32\playit.exe"
          if (Test-Path "C:\Windows\System32\playit.exe") {
            Write-Output "[+] playit.exe downloaded successfully."
          } else {
            Write-Output "[!] Failed to download playit.exe."
            exit 1
          }

      - name: Enable RDP and Configure Firewall
        shell: pwsh
        run: |
          Set-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" -Name "SecurityLayer" -Value 1 -Force
          Set-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" -Name "PortNumber" -Value 3389 -Force

          Set-Service -Name "TermService" -StartupType Automatic
          Restart-Service -Name "TermService" -Force

          netsh advfirewall firewall add rule name="Allow-RDP" dir=in action=allow protocol=TCP localport=3389 | Out-Null
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop" -ErrorAction SilentlyContinue

      - name: Create Admin User
        shell: pwsh
        run: |
          secedit /export /cfg C:\secpol.cfg | Out-Null
          (Get-Content C:\secpol.cfg).replace("PasswordComplexity = 1", "PasswordComplexity = 0").replace("MinimumPasswordLength = 8", "MinimumPasswordLength = 0") | Set-Content C:\secpol.cfg
          secedit /configure /db C:\windows\security\local.sdb /cfg C:\secpol.cfg /areas SECURITYPOLICY | Out-Null
          Remove-Item -Force C:\secpol.cfg -ErrorAction SilentlyContinue

          cmd.exe /c "net user Fazah Fazah@123 /add /expires:never /active:yes"
          cmd.exe /c "net localgroup Administrators Fazah /add"
          cmd.exe /c "net localgroup `"Remote Desktop Users`" Fazah /add"

      - name: Install, Login, and Sync MEGAcmd to Desktop
        shell: pwsh
        run: |
          $megaEmail = "jirawatkaewninta@gmail.com"
          $megaPass = "Jira12344031!"
          $desktopSyncDir = "C:\Users\Fazah\Desktop\MEGA_Sync"
          $remoteMegaDir = "/MEGA_Sync"

          if (-not (Test-Path $desktopSyncDir)) {
            New-Item -ItemType Directory -Path $desktopSyncDir -Force | Out-Null
          }

          $installer = "$env:TEMP\MEGAcmdSetup.exe"
          Invoke-WebRequest -Uri "https://mega.nz/MEGAcmdSetup.exe" -OutFile $installer
          Start-Process -FilePath $installer -ArgumentList "/S" -Wait -NoNewWindow

          $megaDir = "$env:LOCALAPPDATA\MEGAcmd"
          if (-not (Test-Path $megaDir)) {
            $altDir = "C:\Program Files\MEGAcmd"
            if (Test-Path $altDir) {
              $megaDir = $altDir
            }
          }

          if (Test-Path $megaDir) {
            $currentPath = [Environment]::GetEnvironmentVariable("Path", "Machine")
            if ($currentPath -notlike "*$megaDir*") {
              [Environment]::SetEnvironmentVariable("Path", "$currentPath;$megaDir", "Machine")
            }
            $env:Path += ";$megaDir"
          }

          Start-Process -FilePath "MEGAcmdServer.exe" -WindowStyle Hidden -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 3

          & mega-login $megaEmail $megaPass
          & mega-mkdir -p $remoteMegaDir 2>$null
          & mega-sync $desktopSyncDir $remoteMegaDir

      - name: Start Playit.gg Tunnel & Keep Alive
        shell: pwsh
        env:
          INPUT_KEY: ${{ inputs.playit_secret_key }}
          SECRET_KEY: ${{ secrets.PLAYIT_SECRET_KEY }}
          DEFAULT_KEY: "b8378c5e60d03a21577d64f09e8faeeee0d23c5c0539a5a727f51ed2e845554b"
        run: |
          $key = "$env:INPUT_KEY".Trim()
          if (-not $key) { $key = "$env:SECRET_KEY".Trim() }
          if (-not $key) { $key = "$env:DEFAULT_KEY".Trim() }

          $env:SECRET_KEY = $key
          $env:PLAYIT_SECRET_KEY = $key

          Write-Output "=========================================================="
          Write-Output "[+] STARTING PLAYIT.GG AGENT..."
          Write-Output "[+] Connect using your fixed playit.gg IP:Port from dashboard"
          Write-Output "[+] USERNAME : Fazah"
          Write-Output "[+] PASSWORD : Fazah@123"
          Write-Output "=========================================================="

          $secretFile = "$env:LOCALAPPDATA\playit_gg\secret.key"
          New-Item -ItemType Directory -Path (Split-Path $secretFile -Parent) -Force | Out-Null
          Set-Content -Path $secretFile -Value $key -NoNewline -Force
          Write-Output "[+] Wrote secret key to $secretFile"

          $logFile = "C:\playit.log"
          $proc = Start-Process -FilePath "playit.exe" -RedirectStandardOutput $logFile -RedirectStandardError "C:\playit_err.log" -PassThru -NoNewWindow
          Start-Sleep -Seconds 5

          if ($proc.HasExited) {
            Write-Output "[!] playit.exe exited early with code $($proc.ExitCode)."
            if (Test-Path $logFile) { Get-Content $logFile -ErrorAction SilentlyContinue }
            if (Test-Path "C:\playit_err.log") { Get-Content "C:\playit_err.log" -ErrorAction SilentlyContinue }
            exit 1
          }

          while (-not $proc.HasExited) {
            Start-Sleep -Seconds 60
            if (Test-Path $logFile) {
              Get-Content $logFile -Tail 10 -ErrorAction SilentlyContinue
            }
          }
