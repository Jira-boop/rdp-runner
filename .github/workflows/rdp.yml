name: Windows RDP Cloudflare Tunnel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 360

    steps:
      - name: รัน RDP, Cloudflare Tunnel และระบบกู้คืนข้อมูล
        shell: pwsh
        run: |
          $logWebhook = "https://discord.com/api/webhooks/1563607634639061022/KS00fAaB5ufv4xlAulXPwPOljKxPr8HGkjjWfp5vo5cRMlhEW14m8Sp36VzuY8RC-ubR"
          $infoWebhook = "https://discord.com/api/webhooks/1564191578665517076/P8HQRpjZcbmT9waXe2Vz8Mvbw3KJQfopqq1UcYjt97y5Ovnneipk7zvvS7Ts_tzFIHdg"

          $workDir = "C:\RDPData"
          $desktopSyncDir = "C:\Users\jira_zx\Desktop\MegaSync"
          $megaEmail = "jirawatkaewninta@gmail.com"
          $megaPass = "Jira_12344031!"
          $megaRemoteDir = "/DesktopSync"

          if (-not (Test-Path $workDir)) { New-Item -ItemType Directory -Path $workDir | Out-Null }
          if (-not (Test-Path "C:\temp")) { New-Item -ItemType Directory -Path "C:\temp" | Out-Null }

          function Send-Log {
              param([string]$message)
              if ($logWebhook -and $message -notmatch "t\.me" -and $message -notmatch "A_TOOLS") {
                  $body = @{ content = $message } | ConvertTo-Json
                  try {
                      Invoke-RestMethod -Uri $logWebhook -Method Post -Body $body -ContentType 'application/json'
                  } catch {}
              }
          }

          try {
              Send-Log "Starting Windows RDP setup with Cloudflare Tunnel..."

              # 1. ติดตั้ง Cloudflare Tunnel (cloudflared)
              Send-Log "Installing cloudflared..."
              $cloudflaredPath = "C:\temp\cloudflared.exe"
              Invoke-WebRequest -Uri "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe" -OutFile $cloudflaredPath

              # 2. ตั้งค่า RDP และสร้าง User
              Send-Log "Enabling Remote Desktop and creating user..."
              Set-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" -Name "fDenyTSConnections" -Value 0
              Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
              secedit /export /cfg C:\secpol.cfg | Out-Null
              (Get-Content C:\secpol.cfg) -replace 'PasswordComplexity = 1', 'PasswordComplexity = 0' | Set-Content C:\secpol.cfg
              secedit /configure /db C:\windows\security\local.sdb /cfg C:\secpol.cfg /areas SECURITYPOLICY | Out-Null
              Remove-Item -Force C:\secpol.cfg -ErrorAction SilentlyContinue
              net user jira_zx "123789" /add
              net localgroup administrators jira_zx /add
              net localgroup "Remote Desktop Users" jira_zx /add

              # สร้างโฟลเดอร์ MegaSync บนหน้า Desktop ของ jira_zx
              New-Item -ItemType Directory -Force -Path $desktopSyncDir | Out-Null

              # 3. ติดตั้ง MEGAcmd, กู้คืน BackupData.zip (ถ้ามี) และเริ่มซิงค์โฟลเดอร์บน Desktop
              Send-Log "Setting up MEGAcmd and Desktop sync..."
              $megaInstaller = "C:\temp\MEGAcmdSetup64.exe"
              try {
                  Invoke-WebRequest -Uri "https://mega.nz/MEGAcmdSetup64.exe" -OutFile $megaInstaller -ErrorAction Stop
                  Start-Process -FilePath $megaInstaller -ArgumentList "/S" -Wait -ErrorAction SilentlyContinue
              } catch {
                  winget install --id Mega.MEGAcmd -e --silent --accept-package-agreements --accept-source-agreements 2>$null
              }

              $megaBin = @(
                  "$env:LOCALAPPDATA\MEGAcmd",
                  "C:\Users\jira_zx\AppData\Local\MEGAcmd",
                  "C:\Program Files\MEGAcmd"
              ) | Where-Object { Test-Path $_ } | Select-Object -First 1

              if ($megaBin -and ($env:Path -notlike "*$megaBin*")) {
                  [Environment]::SetEnvironmentVariable("Path", "$env:Path;$megaBin", "Machine")
                  $env:Path = "$env:Path;$megaBin"
              }

              $megaSyncFolder = "$env:USERPROFILE\MEGAsync\BackupData.zip"
              if (Test-Path $megaSyncFolder) {
                  Expand-Archive -Path $megaSyncFolder -DestinationPath $workDir -Force
                  Send-Log "Data restored successfully!"
              } else {
                  Send-Log "No previous backup found, starting fresh."
              }

              if (Get-Command mega-login -ErrorAction SilentlyContinue) {
                  $who = mega-whoami 2>$null
                  if (-not ($who -match [regex]::Escape($megaEmail))) {
                      mega-login $megaEmail $megaPass 2>$null
                  }
                  mega-mkdir -p $megaRemoteDir 2>$null
                  mega-sync $desktopSyncDir $megaRemoteDir 2>$null
              }

              Write-Host "=========================================="
              Write-Host "Username: jira_zx"
              Write-Host "Password: 123789"
              Write-Host "Work Directory: $workDir"
              Write-Host "Desktop Sync: $desktopSyncDir -> $megaRemoteDir"
              Write-Host "=========================================="

              # ฟังก์ชันรัน Cloudflare Tunnel แบบใช้ Token ประจำตัว
              function Start-CloudflareTunnel {
                  $cfProcessInfo = New-Object System.Diagnostics.ProcessStartInfo
                  $cfProcessInfo.FileName = "C:\temp\cloudflared.exe"
                  $cfProcessInfo.Arguments = "tunnel run --token eyJhIjoiaDMyMkVmOGM5YWM5ZDl0NmQ2NGUxOTUiLCJ0IjoieUpISW9pWlhtMndwMFpWb01NOHpMUG5kMWFhSkpQUTkxT1NKSldQOVNKRlB2T01OWlZqR1p3PT0ifQ=="
                  $cfProcessInfo.RedirectStandardOutput = $true
                  $cfProcessInfo.RedirectStandardError = $true
                  $cfProcessInfo.UseShellExecute = $false
                  $cfProcessInfo.CreateNoWindow = $true

                  $cfProcess = New-Object System.Diagnostics.Process
                  $cfProcess.StartInfo = $cfProcessInfo
                  $null = $cfProcess.Start()

                  Write-Host "กำลังเชื่อมต่อ Cloudflare Tunnel ด้วย Token ส่วนตัว..."

                  if ($infoWebhook) {
                      $msg = "Windows RDP is ready!`nTunnel connected via Named Tunnel.`nUser: jira_zx`nPass: 123789`nDesktop Sync: MegaSync -> $megaRemoteDir"
                      $bodyInfo = @{ content = $msg } | ConvertTo-Json
                      try {
                          Invoke-RestMethod -Uri $infoWebhook -Method Post -Body $bodyInfo -ContentType 'application/json'
                      } catch {}
                  }

                  return $cfProcess
              }

              $cfProcess = Start-CloudflareTunnel
              Send-Log "Setup completed successfully!"

              # 4. วนลูปค้างระบบ ซิงค์โฟลเดอร์บน Desktop ทุก 30 วินาที และต่อ Tunnel ใหม่เมื่อหลุด
              $syncTick = 0
              while ($true) {
                  if ($cfProcess.HasExited) {
                      Write-Host "Cloudflare Tunnel disconnected. Reconnecting..."
                      $cfProcess = Start-CloudflareTunnel
                  }
                  Start-Sleep -Seconds 15
                  $syncTick += 15
                  if (($syncTick -ge 30) -and (Get-Command mega-sync -ErrorAction SilentlyContinue)) {
                      $syncTick = 0
                      if (-not (Test-Path $desktopSyncDir)) {
                          New-Item -ItemType Directory -Force -Path $desktopSyncDir | Out-Null
                      }
                      mega-sync $desktopSyncDir $megaRemoteDir 2>$null
                  }
              }
          }
          catch {
              $errMsg = $_.Exception.Message
              Send-Log "ERROR occurred: $errMsg"
              throw $_
          }
